<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rekkit 🔥</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Rekkit 🔥</h1>
  </header>

  <!-- AUTH -->
  <section id="auth" class="center card">
    <h2>Login / Signup</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <div class="row">
      <button id="btnSignup">Signup</button>
      <button id="btnLogin">Login</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </section>

  <!-- APP -->
  <main id="app" class="app" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="me">
        <span id="meName"></span>
        <button id="logout">Logout</button>
      </div>

      <div class="section">
        <h3>Direct Messages</h3>
        <ul id="dmList" class="list"></ul>
      </div>

      <div class="section">
        <h3>Groups</h3>
        <ul id="groupList" class="list"></ul>
        <div class="row create">
          <input id="newGroup" placeholder="New group name" />
          <button id="createGroup">Create</button>
        </div>
      </div>
    </aside>

    <!-- Chat pane -->
    <section class="chat">
      <div class="chat-header">
        <h2 id="chatTitle">Pick a chat</h2>
      </div>

      <div class="chat-box">
        <ul id="messages"></ul>
      </div>

      <!-- Chat controls -->
      <form id="form" class="composer">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
<section id="videoChat" style="display:none; margin-top:20px; text-align:center;">
  <h3>Video Chat</h3>
  <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
    <video id="localVideo" autoplay playsinline muted style="width:200px; border:2px solid orange; border-radius:8px;"></video>
    <video id="remoteVideo" autoplay playsinline style="width:200px; border:2px solid orange; border-radius:8px;"></video>
  </div>
  <button id="startVideo" style="padding:6px 12px; background:orange; border:none; border-radius:6px; cursor:pointer; color:white;">Start Video</button>
  <button id="stopVideo" style="padding:6px 12px; background:red; border:none; border-radius:6px; cursor:pointer; color:white; display:none;">Stop Video</button>
</section>
      <!-- Container for GIF search -->
      <div id="gifContainer" style="display:none; margin-top:10px;">
        <input type="text" id="gifSearch" placeholder="Search GIFs...">
        <button id="searchGifBtn">Search</button>
        <div id="gifResults" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>
      </div>

      <div id="chat-controls">
        <button id="gifBtn">🎬 GIF</button>
        <input type="file" id="imageUpload" accept="image/*" style="display:none;">
        <button id="imageBtn">🖼️ Image</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // UI refs
    const auth = document.getElementById("auth");
    const authMsg = document.getElementById("authMsg");
    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const btnSignup = document.getElementById("btnSignup");

    const app = document.getElementById("app");
    const meName = document.getElementById("meName");
    const logout = document.getElementById("logout");

    const dmList = document.getElementById("dmList");
    const groupList = document.getElementById("groupList");
    const newGroup = document.getElementById("newGroup");
    const createGroup = document.getElementById("createGroup");

    const chatTitle = document.getElementById("chatTitle");
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    let me = null;
    let current = { kind: null, id: null };

    // --- auth handlers ---
    btnSignup.onclick = async () => {
      const r = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      authMsg.textContent = res.success ? "Signup successful! Please log in." : res.error;
    };

    btnLogin.onclick = async () => {
      const r = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      if (res.success) {
        me = res.username;
        meName.textContent = me;
        auth.style.display = "none";
        app.style.display = "grid";
        await refreshLists();
      } else {
        authMsg.textContent = res.error;
      }
    };

    logout.onclick = () => {
      me = null;
      current = { kind: null, id: null };
      messages.innerHTML = "";
      chatTitle.textContent = "Pick a chat";
      app.style.display = "none";
      auth.style.display = "block";
      usernameEl.value = "";
      passwordEl.value = "";
      authMsg.textContent = "";
    };

    // --- lists ---
    async function refreshLists() {
      const [users, groups] = await Promise.all([
        fetch("/users").then(r => r.json()),
        fetch("/groups").then(r => r.json()),
      ]);

      dmList.innerHTML = "";
      users.filter(u => u !== me).forEach(u => {
        const li = document.createElement("li");
        li.textContent = u;
        li.onclick = () => openDM(u);
        dmList.appendChild(li);
      });

      groupList.innerHTML = "";
      groups.forEach(g => {
        const li = document.createElement("li");
        li.textContent = g;
        li.onclick = () => openGroup(g);
        groupList.appendChild(li);
      });
    }

    createGroup.onclick = async () => {
      const name = newGroup.value.trim().toLowerCase();
      if (!name) return;
      const r = await fetch("/groups", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const res = await r.json();
      if (res.success) {
        newGroup.value = "";
        refreshLists();
      } else {
        alert(res.error);
      }
    };

    function openDM(other) {
      current = { kind: "dm", id: other };
      chatTitle.textContent = `Chat with ${other}`;
      messages.innerHTML = "";
      socket.emit("join dm", { me, other });
    }

    function openGroup(group) {
      current = { kind: "group", id: group };
      chatTitle.textContent = `#${group}`;
      messages.innerHTML = "";
      socket.emit("join group", { username: me, group });
    }

    // --- send / receive ---
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!input.value || !current.kind) return;
      socket.emit("chat message", {
        kind: current.kind,
        to: current.id,
        from: me,
        text: input.value
      });
      input.value = "";
    });

    socket.on("chat message", (m) => {
      if (
        (m.kind === "group" && current.kind === "group" && m.to === current.id) ||
        (m.kind === "dm" && current.kind === "dm" &&
          ((m.from === me && m.to === current.id) || (m.from === current.id && m.to === me)))
      ) {
        addMessage(m);
      }
    });

    function addMessage(m) {
      const li = document.createElement("li");
      li.className = m.from === me ? "me" : "other";
      li.innerHTML = `<strong>${m.from}</strong> ${m.text}`;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

  <!-- GIF + Image logic -->
  <script>
    const gifBtn = document.getElementById("gifBtn");
    const gifContainer = document.getElementById("gifContainer");
    const searchGifBtn = document.getElementById("searchGifBtn");
    const gifResults = document.getElementById("gifResults");
    const imageBtn = document.getElementById("imageBtn");
    const imageUpload = document.getElementById("imageUpload");

    gifBtn.addEventListener("click", () => {
      gifContainer.style.display = gifContainer.style.display === "none" ? "block" : "none";
    });

    searchGifBtn.addEventListener("click", async () => {
      const query = document.getElementById("gifSearch").value;
      if (!query) return;
      const apiKey = "dc6zaTOxFJmzC";
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${apiKey}&q=${query}&limit=10`);
      const data = await res.json();
      gifResults.innerHTML = "";
      data.data.forEach(gif => {
        const img = document.createElement("img");
        img.src = gif.images.fixed_height_small.url;
        img.style.cursor = "pointer";
        img.addEventListener("click", () => {
          socket.emit("chat message", {
            kind: current.kind,
            to: current.id,
            from: me,
            text: `<img src="${gif.images.fixed_height.url}" style="max-width:200px;">`
          });
          gifContainer.style.display = "none";
        });
        gifResults.appendChild(img);
      });
    });

    imageBtn.addEventListener("click", () => {
      imageUpload.click();
    });

    imageUpload.addEventListener("change", () => {
      const file = imageUpload.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        socket.emit("chat message", {
          kind: current.kind,
          to: current.id,
          from: me,
          text: `<img src="${reader.result}" style="max-width:200px;">`
        });
      };
      reader.readAsDataURL(file);
    });
  </script>
<script>
let localStream;
let peerConnection;

const startCallBtn = document.getElementById("startCall");
const endCallBtn = document.getElementById("endCall");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

startCallBtn.onclick = async () => {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;

  peerConnection = new RTCPeerConnection();

  // Add local tracks
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  // Remote stream
  peerConnection.ontrack = event => {
    remoteVideo.srcObject = event.streams[0];
  };

  // ICE candidates
  peerConnection.onicecandidate = event => {
    if (event.candidate) {
      socket.emit("ice-candidate", event.candidate);
    }
  };

  // Create offer
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit("offer", offer);
};

// Listen for answer
socket.on("answer", async (answer) => {
  await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

// Listen for offer
socket.on("offer", async (offer) => {
  peerConnection = new RTCPeerConnection();
  peerConnection.ontrack = event => {
    remoteVideo.srcObject = event.streams[0];
  };
  peerConnection.onicecandidate = event => {
    if (event.candidate) {
      socket.emit("ice-candidate", event.candidate);
    }
  };
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit("answer", answer);
});

// ICE candidate exchange
socket.on("ice-candidate", async (candidate) => {
  try {
    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
  } catch (e) {
    console.error("Error adding ICE candidate", e);
  }
});

// End call
endCallBtn.onclick = () => {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }
  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
};
</script>
</body>
<!-- Video Chat -->
<div id="videoChat" style="margin-top:20px;">
  <h3>Video Chat</h3>
  <video id="localVideo" autoplay muted playsinline style="width:200px; border:2px solid orange; border-radius:10px;"></video>
  <video id="remoteVideo" autoplay playsinline style="width:200px; border:2px solid orange; border-radius:10px;"></video>
  <button id="startVideoBtn">Start Video</button>
</div>

<script>
const videoChat = document.getElementById("videoChat");
const startVideo = document.getElementById("startVideo");
const stopVideo = document.getElementById("stopVideo");

startVideo.addEventListener("click", async () => {
  videoChat.style.display = "block";
  startVideo.style.display = "none";
  stopVideo.style.display = "inline-block";

  // your existing getUserMedia + WebRTC code here
});

stopVideo.addEventListener("click", () => {
  videoChat.style.display = "none";
  startVideo.style.display = "inline-block";
  stopVideo.style.display = "none";

  // stop video tracks if needed
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
 </html>
