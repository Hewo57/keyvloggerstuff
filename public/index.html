<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rekkit 🔥</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 id="rekTitle">Rekkit 🔥</h1>
    <button id="videoChatBtn" style="float:right; margin-right:15px;">📹 Video Chat</button>
  </header>

  <!-- AUTH -->
  <section id="auth" class="center card">
    <h2>Login / Signup</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <div class="row">
      <button id="btnSignup">Signup</button>
      <button id="btnLogin">Login</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </section>

  <!-- APP -->
  <main id="app" class="app" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="me">
        <span id="meName"></span>
        <button id="logout">Logout</button>
      </div>

      <div class="section">
        <h3>Direct Messages</h3>
        <ul id="dmList" class="list"></ul>
      </div>

      <div class="section">
        <h3>Groups</h3>
        <ul id="groupList" class="list"></ul>
        <div class="row create">
          <input id="newGroup" placeholder="New group name" />
          <button id="createGroup">Create</button>
        </div>
      </div>
    </aside>

    <!-- Chat pane -->
    <section class="chat">
      <div class="chat-header">
        <h2 id="chatTitle">Pick a chat</h2>
      </div>
      <div class="chat-box">
        <ul id="messages"></ul>
      </div>
      <form id="form" class="composer">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
    </section>
  </main>

  <!-- Easter Egg video (hidden by default) -->
  <video id="easterEgg" src="stickbug.mp4" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999;" loop></video>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Easter Egg trigger for Baka
    const rekTitle = document.getElementById("rekTitle");
    const easterEgg = document.getElementById("easterEgg");
    let me = null;

    rekTitle.addEventListener("click", () => {
      if (me === "baka") {
        easterEgg.style.display = "block";
        easterEgg.play();
      }
    });

    // video chat button
    document.getElementById("videoChatBtn").onclick = () => {
      if (!me) return alert("Login first!");
      window.open(`/video.html?room=${Date.now()}&user=${me}`, "_blank");
    };

    // Auth logic
    const auth = document.getElementById("auth");
    const authMsg = document.getElementById("authMsg");
    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const btnSignup = document.getElementById("btnSignup");
    const app = document.getElementById("app");
    const meName = document.getElementById("meName");
    const logout = document.getElementById("logout");

    btnSignup.onclick = async () => {
      const r = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      authMsg.textContent = res.success ? "Signup successful! Please log in." : res.error;
    };

    btnLogin.onclick = async () => {
      const r = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      if (res.success) {
        me = res.username;
        meName.textContent = me;
        auth.style.display = "none";
        app.style.display = "grid";
      } else {
        authMsg.textContent = res.error;
      }
    };

    logout.onclick = () => {
      me = null;
      app.style.display = "none";
      auth.style.display = "block";
      usernameEl.value = "";
      passwordEl.value = "";
      authMsg.textContent = "";
    };
  </script>
</body>
</html>
