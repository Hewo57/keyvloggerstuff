<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rekkit 🔥</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #videoBtn {
      float: right;
      background: #ff6600;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    #rickroll {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #rickroll video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 id="rekTitle">Rekkit 🔥</h1>
  </header>

  <!-- AUTH -->
  <section id="auth" class="center card">
    <h2>Login / Signup</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <div class="row">
      <button id="btnSignup">Signup</button>
      <button id="btnLogin">Login</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </section>

  <!-- APP -->
  <main id="app" class="app" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="me">
        <span id="meName"></span>
        <button id="logout">Logout</button>
      </div>

      <div class="section">
        <h3>Direct Messages</h3>
        <ul id="dmList" class="list"></ul>
      </div>

      <div class="section">
        <h3>Groups</h3>
        <ul id="groupList" class="list"></ul>
        <div class="row create">
          <input id="newGroup" placeholder="New group name" />
          <button id="createGroup">Create</button>
        </div>
      </div>
    </aside>

    <!-- Chat pane -->
    <section class="chat">
      <div class="chat-header">
        <h2 id="chatTitle">Pick a chat</h2>
        <button id="videoBtn">📹 Video</button>
      </div>

      <div class="chat-box">
        <ul id="messages"></ul>
      </div>

      <form id="form" class="composer">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
    </section>
  </main>

  <!-- Hidden Easter Egg -->
  <div id="rickroll">
    <video autoplay loop>
      <source src="stickbug.mp4" type="video/mp4">
    </video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let me = null;

    const auth = document.getElementById("auth");
    const app = document.getElementById("app");
    const meName = document.getElementById("meName");
    const authMsg = document.getElementById("authMsg");

    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const btnSignup = document.getElementById("btnSignup");
    const logout = document.getElementById("logout");

    const dmList = document.getElementById("dmList");
    const groupList = document.getElementById("groupList");
    const newGroup = document.getElementById("newGroup");
    const createGroup = document.getElementById("createGroup");

    const chatTitle = document.getElementById("chatTitle");
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const rekTitle = document.getElementById("rekTitle");
    const rickroll = document.getElementById("rickroll");

    let current = { kind: null, id: null };

    // AUTH
    btnSignup.onclick = async () => {
      const r = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      authMsg.textContent = res.success ? "Signup successful! Please log in." : res.error;
    };

    btnLogin.onclick = async () => {
      const r = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
      });
      const res = await r.json();
      if (res.success) {
        me = res.username;
        meName.textContent = me;
        auth.style.display = "none";
        app.style.display = "grid";
        await refreshLists();
      } else {
        authMsg.textContent = res.error;
      }
    };

    logout.onclick = () => {
      me = null;
      current = { kind: null, id: null };
      messages.innerHTML = "";
      chatTitle.textContent = "Pick a chat";
      app.style.display = "none";
      auth.style.display = "block";
      usernameEl.value = "";
      passwordEl.value = "";
      authMsg.textContent = "";
    };

    // LISTS
    async function refreshLists() {
      const [users, groups] = await Promise.all([
        fetch("/users").then(r => r.json()),
        fetch("/groups").then(r => r.json()),
      ]);
      dmList.innerHTML = "";
      users.filter(u => u !== me).forEach(u => {
        const li = document.createElement("li");
        li.textContent = u;
        li.onclick = () => openDM(u);
        dmList.appendChild(li);
      });

      groupList.innerHTML = "";
      groups.forEach(g => {
        const li = document.createElement("li");
        li.textContent = g;
        li.onclick = () => openGroup(g);
        groupList.appendChild(li);
      });
    }

    createGroup.onclick = async () => {
      const name = newGroup.value.trim().toLowerCase();
      if (!name) return;
      const r = await fetch("/groups", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const res = await r.json();
      if (res.success) {
        newGroup.value = "";
        refreshLists();
      } else {
        alert(res.error);
      }
    };

    function openDM(other) {
      current = { kind: "dm", id: other };
      chatTitle.textContent = `Chat with ${other}`;
      messages.innerHTML = "";
      socket.emit("join dm", { me, other });
    }

    function openGroup(group) {
      current = { kind: "group", id: group };
      chatTitle.textContent = `#${group}`;
      messages.innerHTML = "";
      socket.emit("join group", { username: me, group });
    }

    // CHAT
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!input.value || !current.kind) return;
      socket.emit("chat message", {
        kind: current.kind,
        to: current.id,
        from: me,
        text: input.value
      });
      input.value = "";
    });

    socket.on("chat message", (m) => {
      if (
        (m.kind === "group" && current.kind === "group" && m.to === current.id) ||
        (m.kind === "dm" && current.kind === "dm" &&
          ((m.from === me && m.to === current.id) || (m.from === current.id && m.to === me)))
      ) {
        addMessage(m);
      }
    });

    function addMessage(m) {
      const li = document.createElement("li");
      li.className = m.from === me ? "me" : "other";
      li.innerHTML = `<strong>${m.from}</strong> ${escapeHtml(m.text)}`;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // VIDEO CHAT
    document.getElementById("videoBtn").onclick = () => {
      if (!current.kind || !current.id) {
        alert("Pick a chat first!");
        return;
      }
      const room = current.kind + "-" + current.id;
      window.open(`/video.html?room=${room}&user=${me}`, "_blank");
    };

    // SECRET Easter Egg
    rekTitle.onclick = () => {
      if (me === "baka") {
        rickroll.style.display = "flex";
      }
    };
  </script>
</body>
</html>
