<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <title>Rekkit 🔥</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Rekkit 🔥</h1>
  </header>

  <!-- LOGIN -->
  <div id="auth" class="center">
    <h2>Login / Signup</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <div>
      <button onclick="signup()">Signup</button>
      <button onclick="login()">Login</button>
    </div>
    <p id="authMsg"></p>
  </div>

  <!-- CHAT LIST -->
  <div id="chatList" class="center" style="display:none;">
    <h2>Select a Chat</h2>
    <ul id="chats">
      <!-- Filled dynamically -->
    </ul>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- CHAT WINDOW -->
  <div id="chatWindow" class="center" style="display:none;">
    <h2 id="chatTitle">Chat</h2>
    <div class="chat-box">
      <ul id="messages"></ul>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message..." />
      <button>Send</button>
    </form>
    <button onclick="backToList()">⬅ Back</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = null;
    let currentChat = null;

    // AUTH
    function signup() {
      fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username.value, password: password.value })
      }).then(r => r.json()).then(res => {
        authMsg.innerText = res.success ? "Signup successful! Please login." : res.error;
      });
    }

    function login() {
      fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username.value, password: password.value })
      }).then(r => r.json()).then(res => {
        if (res.success) {
          currentUser = res.username;
          auth.style.display = "none";
          chatList.style.display = "block";
          loadChats();
        } else {
          authMsg.innerText = res.error;
        }
      });
    }

    function logout() {
      currentUser = null;
      chatList.style.display = "none";
      chatWindow.style.display = "none";
      auth.style.display = "block";
    }

    function loadChats() {
      // For now hardcoded chats
      const chats = ["General", "Alice", "Bob"];
      chatsEl.innerHTML = "";
      chats.forEach(c => {
        const li = document.createElement("li");
        li.innerText = c;
        li.onclick = () => openChat(c);
        chatsEl.appendChild(li);
      });
    }

    function openChat(chatName) {
      currentChat = chatName;
      chatList.style.display = "none";
      chatWindow.style.display = "block";
      chatTitle.innerText = "Chat with " + chatName;
      messages.innerHTML = "";
      socket.emit("join room", chatName);
    }

    function backToList() {
      socket.emit("leave room", currentChat);
      currentChat = null;
      chatWindow.style.display = "none";
      chatList.style.display = "block";
    }

    // CHAT
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const chatsEl = document.getElementById("chats");

    form.addEventListener("submit", e => {
      e.preventDefault();
      if (input.value && currentChat) {
        socket.emit("chat message", { room: currentChat, msg: input.value, user: currentUser });
        input.value = "";
      }
    });

    socket.on("chat message", data => {
      if (data.room === currentChat) {
        const li = document.createElement("li");
        li.className = (data.user === currentUser) ? "me" : "other";
        li.innerHTML = `<strong>${data.user}:</strong> ${data.msg}`;
        messages.appendChild(li);
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
