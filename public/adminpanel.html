<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Panel 🔥</title>
  <style>
    body { font-family: Arial; background: #222; color: white; text-align: center; padding: 20px; }
    input, button { padding: 10px; margin: 5px; border-radius: 6px; border: none; }
    button { background: orange; color: black; cursor: pointer; }
    button:hover { background: darkorange; }
  </style>
</head>
<body>
  <h1>Admin Panel (Rekkit)</h1>
  <p>Ban users or IPs</p>

  <div>
    <input id="banUser" placeholder="Username to ban">
    <button onclick="banUser()">Ban User</button>
  </div>
  <div>
    <input id="banIp" placeholder="IP to ban">
    <button onclick="banIp()">Ban IP</button>
  </div>

  <pre id="result"></pre>

  <script>
    async function banUser() {
      const username = document.getElementById("banUser").value;
      const res = await fetch("/ban", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      });
      document.getElementById("result").textContent = await res.text();
    }

    async function banIp() {
      const ip = document.getElementById("banIp").value;
      const res = await fetch("/ban", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ip })
      });
      document.getElementById("result").textContent = await res.text();
    }
  </script>
<script>
  async function loadUsers() {
    const res = await fetch("/admin/users");
    const users = await res.json();
    const container = document.getElementById("userList");

    container.innerHTML = "";
    users.forEach(u => {
      container.innerHTML += `
        <div>
          <strong>${u.username}</strong> ${u.banned ? "❌ (BANNED)" : "✅ (Active)"}
          <button onclick="banUser('${u.id}')">Ban</button>
          <button onclick="unbanUser('${u.id}')">Unban</button>
        </div>
      `;
    });
  }

  async function banUser(userId) {
    await fetch(`/admin/ban/${userId}`, { method: "POST" });
    loadUsers();
  }

  async function unbanUser(userId) {
    await fetch(`/admin/unban/${userId}`, { method: "POST" });
    loadUsers();
  }

  loadUsers();
</script>
</body>
</html>
