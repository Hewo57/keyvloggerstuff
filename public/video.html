<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rekkit Video</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --orange:#ff6600; background: #fff7f0; }
    body{margin:0;font-family:Inter,system-ui,Arial;background:#fff7f0;color:#222;}
    header{background:var(--orange);color:#fff;padding:14px 8px;text-align:center;font-weight:700;}
    .container{display:flex;gap:12px;padding:12px;box-sizing:border-box;}
    .mainVideo{
      flex:1;
      background:#000;
      border:4px solid var(--orange);
      border-radius:12px;
      height: calc(80vh - 80px);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }
    .side{
      width:280px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .side .slot{
      flex:1;
      background:#000;
      border:4px solid var(--orange);
      border-radius:12px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    video{ width:100%; height:100%; object-fit:cover; display:block; }
    .controls{padding:10px;display:flex;gap:10px;justify-content:center;}
    .controls button{background:var(--orange);border:none;color:white;padding:10px 14px;border-radius:8px;cursor:pointer;}
    .smallLabel{position:absolute;left:10px;top:10px;background: rgba(0,0,0,0.4); color:#fff;padding:4px 6px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
  <header>Rekkit Video — room: <span id="roomName">...</span></header>

  <div class="container">
    <div class="mainVideo" id="mainWrap">
      <span class="smallLabel" id="mainLabel">You (local)</span>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div class="side">
      <div class="slot" id="peer1Wrap">
        <span class="smallLabel">Peer 1</span>
        <video id="peer1" autoplay playsinline></video>
      </div>
      <div class="slot" id="peer2Wrap">
        <span class="smallLabel">Peer 2</span>
        <video id="peer2" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="joinBtn">Join Room</button>
    <button id="leaveBtn" disabled>Leave Room</button>
    <button id="muteBtn" disabled>Mute</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- Setup ---
    function qs(name){ const u=new URLSearchParams(location.search); return u.get(name); }
    const room = qs('room') || 'room1';
    const username = qs('user') || 'guest';
    document.getElementById('roomName').textContent = room;

    const socket = io();

    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const muteBtn = document.getElementById('muteBtn');
    const localVideo = document.getElementById('localVideo');
    const peer1 = document.getElementById('peer1');
    const peer2 = document.getElementById('peer2');

    let localStream = null;
    const peers = {}; // socketId -> RTCPeerConnection

    const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
// STUN + TURN servers
const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:openrelay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:openrelay.metered.ca:443?transport=tcp",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ]
};
    async function startLocal() {
      localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
      localVideo.srcObject = localStream;
    }

    function attachRemoteStream(stream) {
      if(!peer1.srcObject) peer1.srcObject = stream;
      else if(!peer2.srcObject) peer2.srcObject = stream;
    }

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(config);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => attachRemoteStream(e.streams[0]);
      pc.onicecandidate = e => {
        if(e.candidate) {
          socket.emit('candidate', { to: targetId, candidate: e.candidate });
        }
      };
      return pc;
    }

    // --- Buttons ---
    joinBtn.onclick = async () => {
      joinBtn.disabled = true;
      await startLocal();
      socket.emit('join-room', { room, user: username });
      leaveBtn.disabled = false;
      muteBtn.disabled = false;
    };

    leaveBtn.onclick = () => {
      socket.emit('leave-room', { room });
      if(localStream) localStream.getTracks().forEach(t => t.stop());
      localVideo.srcObject = null;
      peer1.srcObject = null;
      peer2.srcObject = null;
      joinBtn.disabled = false;
      leaveBtn.disabled = true;
      muteBtn.disabled = true;
    };

    muteBtn.onclick = () => {
      const audioTrack = localStream.getAudioTracks()[0];
      if(audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        muteBtn.textContent = audioTrack.enabled ? "Mute" : "Unmute";
      }
    };

    // --- Socket handlers ---
    socket.on('joined', async ({ otherIds }) => {
      for(const otherId of otherIds){
        const pc = createPeerConnection(otherId);
        peers[otherId] = pc;
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { to: otherId, sdp: offer });
      }
    });

    socket.on('offer', async ({ from, sdp }) => {
      const pc = createPeerConnection(from);
      peers[from] = pc;
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('answer', { to: from, sdp: answer });
    });

    socket.on('answer', async ({ from, sdp }) => {
      const pc = peers[from];
      if(pc) await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    });

    socket.on('candidate', async ({ from, candidate }) => {
      const pc = peers[from];
      if(pc) {
        try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
        catch(e) { console.warn("ICE error", e); }
      }
    });

    socket.on('peer-left', ({ id }) => {
      if(peers[id]) {
        peers[id].close();
        delete peers[id];
      }
      peer1.srcObject = null;
      peer2.srcObject = null;
    });
  </script>
</body>
</html>
