<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyvlogger - Developer Community</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
    header { background-color: #00a1d6; color: #fff; padding: 20px 0; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 2.5em; }
    .container { padding: 20px; max-width: 900px; margin: 20px auto; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .chat-box { border: 1px solid #ccc; padding: 15px; background-color: #e6f7ff; height: 400px; overflow-y: scroll; border-radius: 8px; margin-bottom: 10px; }
    .chat-box div { padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .chat-box div:nth-child(odd) { background-color: #bae7ff; }
    .chat-box div:nth-child(even) { background-color: #91d5ff; }
    .username { font-weight: bold; }
    .chat-input { width: calc(100% - 80px); padding: 15px; margin-top: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; display: inline-block; }
    .chat-input-btn { width: 60px; padding: 15px; margin-top: 15px; border: none; background-color: #00a1d6; color: #fff; border-radius: 8px; font-size: 1em; cursor: pointer; display: inline-block; }
    .article-form { margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    .article-form textarea, .article-form input[type="text"] { width: calc(100% - 30px); padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .article-form button { padding: 10px 20px; background-color: #00a1d6; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    footer { text-align: center; padding: 15px; background-color: #00a1d6; color: #fff; position: fixed; width: 100%; bottom: 0; box-shadow: 0 -4px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <header>
    <h1>Keyvlogger - Developer Community</h1>
  </header>
  <div class="container" id="mainContainer">
    <div class="login-container" id="loginContainer">
      <input type="text" id="usernameInput" placeholder="Enter your username">
      <button id="loginButton">Create Account</button>
    </div>
    <div class="chat-container" id="chatContainer" style="display: none;">
      <div class="chat-box" id="chatBox"></div>
      <div>
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your message here...">
        <button class="chat-input-btn" id="sendMessageBtn">Send</button>
      </div>
    </div>
    <div class="article-container" id="articleContainer" style="display: none;">
      <h2>Share an Article</h2>
      <div class="article-form">
        <input type="text" id="articleTitle" placeholder="Article Title">
        <textarea id="articleContent" rows="5" placeholder="Write your article..."></textarea>
        <input type="file" id="imageInput" accept="image/*">
        <button id="postArticleBtn">Post Article</button>
      </div>
    </div>
  </div>
  <footer>
    <p>&copy; 2024 Keyvlogger. All rights reserved.</p>
  </footer>

  <!-- ✅ Only one Socket.IO script -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
  window.onload = function() {
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const loginContainer = document.getElementById('loginContainer');
    const chatContainer = document.getElementById('chatContainer');
    const articleContainer = document.getElementById('articleContainer');
    const usernameInput = document.getElementById('usernameInput');
    const loginButton = document.getElementById('loginButton');
    const sendMessageBtn = document.getElementById('sendMessageBtn');
    const postArticleBtn = document.getElementById('postArticleBtn');
    const articleTitle = document.getElementById('articleTitle');
    const articleContent = document.getElementById('articleContent');
    const imageInput = document.getElementById('imageInput');

    const badWords = ['badword1','badword2','badword3'];
    let username = '';

    const socket = io();

    function censorBadWords(message) {
      let censored = message;
      badWords.forEach(word => {
        const regex = new RegExp(word, 'gi');
        censored = censored.replace(regex, '****');
      });
      return censored;
    }

    function addMessageToChat(user, message) {
      const el = document.createElement('div');
      el.innerHTML = `<span class="username">${user}:</span> <span class="message">${message}</span>`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    loginButton.addEventListener('click', () => {
      username = usernameInput.value.trim();
      if (username) {
        loginContainer.style.display = 'none';
        chatContainer.style.display = 'block';
        articleContainer.style.display = 'block';
      } else {
        alert('Please enter a username.');
      }
    });

    sendMessageBtn.addEventListener('click', () => {
      sendMessage();
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const msg = chatInput.value.trim();
      if (msg && username) {
        const cleanMsg = censorBadWords(msg);
        socket.emit("chat message", { user: username, text: cleanMsg });
        chatInput.value = '';
      }
    }

    socket.on("chat message", (data) => {
      addMessageToChat(data.user, data.text);
    });

    postArticleBtn.addEventListener('click', () => {
      const title = articleTitle.value.trim();
      const content = articleContent.value.trim();
      const imgFile = imageInput.files[0];
      if (title && content && username) {
        const article = document.createElement('div');
        article.innerHTML = `
          <h3>${title}</h3>
          <p>${content}</p>
          ${imgFile ? `<img src="${URL.createObjectURL(imgFile)}" alt="Article Image">` : ''}
          <p>Posted by: ${username}</p>`;
        document.body.appendChild(article);
        articleTitle.value = '';
        articleContent.value = '';
        imageInput.value = '';
        alert('Article posted successfully!');
      } else {
        alert('Please fill out all fields.');
      }
    });
  };
  </script>
</body>
</html>
